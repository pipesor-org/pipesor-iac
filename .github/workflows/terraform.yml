name: Terraform

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        directory:
          - subscription-controls
          - modules/static-web-app
          - modules/foundry
          - modules/application-insights
          - modules/postgresql
          - modules/service-bus
          - modules/container-platform
          - modules/state-store
          - bootstrap/admin
          - bootstrap/dev
          - bootstrap/qa
          - bootstrap/preprod
          - bootstrap/prod
          - modules/resource-group
          - environments/dev
          - environments/qa
          - environments/preprod
          - environments/prod
    env:
      TF_IN_AUTOMATION: "true"
      ARM_USE_CLI: "false"
      ARM_USE_MSI: "false"
      ARM_USE_OIDC: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read Terraform version
        id: terraform
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.terraform.outputs.version }}
          terraform_wrapper: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: git diff --check
      - run: terraform fmt -check -recursive
      - name: Initialize without state access
        working-directory: ${{ matrix.directory }}
        run: terraform init -backend=false -input=false -lockfile=readonly
      - name: Validate
        working-directory: ${{ matrix.directory }}
        run: terraform validate
      - name: Test reviewed mocked plans and caller contracts
        run: bun tests/terraform-contracts.js "${{ matrix.directory }}"
